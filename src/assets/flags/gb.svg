<svg xmlns="http://www.w3.org/2000/svg" width="48" height="32" viewBox="0 0 60 40">
  <!-- Union Jack at 3:2. Every width is the 2:1 original's (60 × 30) times 4/3. -->
  <defs>
    <clipPath id="flag">
      <rect width="60" height="40" rx="4"/>
    </clipPath>
    <!-- One half of each diagonal: the red saltire sits off-center, counterchanged. -->
    <clipPath id="counterchange">
      <path d="M30,20 h30 v20 z v20 h-30 z h-30 v-20 z v-20 h30 z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#flag)">
    <rect width="60" height="40" fill="#012169"/>
    <path d="M0,0 L60,40 M60,0 L0,40" stroke="#FFFFFF" stroke-width="8"/>
    <path d="M0,0 L60,40 M60,0 L0,40" stroke="#C8102E" stroke-width="5.333" clip-path="url(#counterchange)"/>
    <!-- The cross as rectangles, centered on (30, 20). -->
    <rect x="23.333" width="13.334" height="40" fill="#FFFFFF"/>
    <rect y="13.333" width="60" height="13.334" fill="#FFFFFF"/>
    <rect x="26" width="8" height="40" fill="#C8102E"/>
    <rect y="16" width="60" height="8" fill="#C8102E"/>
  </g>
  <rect x="0.5" y="0.5" width="59" height="39" rx="3.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.3"/>
</svg>
