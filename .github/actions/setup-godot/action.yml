name: Set up Godot
description: >
  Installs the Godot editor (and, on request, the export templates for Windows,
  Linux and macOS), puts it on the PATH as `godot` and imports the project.

inputs:
  version:
    description: Godot version as named on github.com/godotengine/godot-builds, e.g. 4.8-dev5 or 4.8-stable.
    # The one place to bump when the project moves to another Godot version.
    default: 4.8-dev5
  templates:
    description: Also install the export templates.
    default: "false"

runs:
  using: composite
  steps:
    - name: Cache Godot
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          ~/godot
          ~/.local/share/godot/export_templates
        key: godot-${{ inputs.version }}-templates-${{ inputs.templates }}

    - name: Download Godot
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        base="https://github.com/godotengine/godot-builds/releases/download/${{ inputs.version }}"
        mkdir -p ~/godot
        curl -fsSL -o /tmp/godot.zip "$base/Godot_v${{ inputs.version }}_linux.x86_64.zip"
        unzip -q /tmp/godot.zip -d /tmp/godot
        mv /tmp/godot/Godot_v${{ inputs.version }}_linux.x86_64 ~/godot/godot
        chmod +x ~/godot/godot

    - name: Download export templates
      if: steps.cache.outputs.cache-hit != 'true' && inputs.templates == 'true'
      shell: bash
      run: |
        base="https://github.com/godotengine/godot-builds/releases/download/${{ inputs.version }}"
        curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${{ inputs.version }}_export_templates.tpz"
        # The folder is named like the version inside the package, e.g. 4.8.dev5.
        dir=~/.local/share/godot/export_templates/$(unzip -p /tmp/templates.tpz templates/version.txt)
        mkdir -p "$dir"
        # Only what the three desktop presets use, not all 1.4 GB.
        unzip -q -j /tmp/templates.tpz -d "$dir" \
          templates/version.txt \
          templates/windows_release_x86_64.exe \
          templates/windows_release_x86_64_console.exe \
          templates/linux_release.x86_64 \
          templates/macos.zip
        rm /tmp/templates.tpz

    - name: Put Godot on the PATH
      shell: bash
      run: echo ~/godot >> "$GITHUB_PATH"

    - name: Import the project
      shell: bash
      run: |
        # A .blend file without Blender to convert it makes Godot skip the
        # whole import. The game only uses the meshes already saved as .tres,
        # so switch the Blender importer off for this checkout. The editor
        # ignores override.cfg, hence the edit of project.godot itself.
        printf '\n[filesystem]\n\nimport/blender/enabled=false\n' >> src/project.godot
        godot --headless --path src --import
