name: Release (Attach Builds)

on:
  release:
    types: [published]
  # A manual run builds the same files and keeps them as a workflow artifact,
  # to try the exports without publishing a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-builds:
    name: Test, export & attach Windows, Linux and macOS builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check tag against project version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(sed -n 's/^config\/version="\(.*\)"$/\1/p' src/project.godot)
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Release tag $TAG does not match config/version \"$version\" in src/project.godot."
            exit 1
          fi

      - name: Set up Godot & import the project
        uses: ./.github/actions/setup-godot
        with:
          templates: "true"

      - name: Run test suite
        run: godot --headless --path src --script res://tests/run_tests.gd

      - name: Export
        run: |
          mkdir -p build/windows build/linux build/macos
          godot --headless --path src --export-release "Windows Desktop" ../build/windows/low-poly-colorizer-demo.exe
          godot --headless --path src --export-release "Linux" ../build/linux/low-poly-colorizer-demo.x86_64
          godot --headless --path src --export-release "macOS" ../build/macos/low-poly-colorizer-demo.zip
          for file in build/windows/low-poly-colorizer-demo.exe build/linux/low-poly-colorizer-demo.x86_64 build/macos/low-poly-colorizer-demo.zip; do
            test -s "$file" || { echo "::error::Export missing: $file"; exit 1; }
          done

      - name: Package
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          name="low-poly-colorizer-demo-${TAG:-${GITHUB_SHA::7}}"
          mkdir dist
          (cd build/windows && zip -9 "../../dist/$name-windows.zip" low-poly-colorizer-demo.exe)
          # zip keeps the executable bit, a bare file attached to a release would not.
          (cd build/linux && chmod +x low-poly-colorizer-demo.x86_64 && zip -9 "../../dist/$name-linux.zip" low-poly-colorizer-demo.x86_64)
          # Godot already packs the .app into a zip.
          cp build/macos/low-poly-colorizer-demo.zip "dist/$name-macos.zip"
          ls -l dist

      - name: Keep builds as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: builds
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Attach builds to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip

      - name: Remove builds from older releases
        # Only the newest release keeps downloads; older ones keep their notes
        # and GitHub's source archives. This runs after the new builds are
        # attached, so there is never a moment without any. A pre-release
        # leaves the last full release's builds alone. Drafts are never touched.
        if: github.event_name == 'release' && !github.event.release.prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          tags=$(gh release list --limit 1000 --json tagName,isDraft --jq '.[] | select(.isDraft | not) | .tagName')
          for tag in $tags; do
            [ "$tag" = "$TAG" ] && continue
            assets=$(gh release view "$tag" --json assets --jq '.assets[].name')
            for asset in $assets; do
              echo "Removing $asset from $tag"
              gh release delete-asset "$tag" "$asset" --yes
            done
          done
